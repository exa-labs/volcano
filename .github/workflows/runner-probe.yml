name: runner-probe
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: [self-hosted]
    steps:
      - name: identity
        run: |
          echo "RCE_PROOF_HOST=$(hostname)"
          id
          uname -a
      - name: env-names-only
        run: |
          echo "---env-names---"
          env | cut -d= -f1 | sort
          echo "---secret-presence (names only, no values)---"
          for v in SERVICE_TOKEN_BACKUP SERVICE_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY EXA_API_KEY OPENAI_API_KEY; do
            if printenv "$v" >/dev/null 2>&1; then echo "$v=present"; else echo "$v=absent"; fi
          done
